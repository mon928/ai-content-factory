name: Sofia Luxury Video Creator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: false
        default: "Latest luxury technology and lifestyle trends"

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download Sofia Luxury code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Create Sofia video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os

          from auto_scheduler import AutoScheduler

          async def main():
              scheduler = AutoScheduler(
                  language="english",
                  niche="tech"
              )

              result = await scheduler.create_content(
                  os.environ.get("VIDEO_TOPIC") or None
              )

              if not result:
                  raise RuntimeError("Video creation failed.")

              video_path = result.get("video")
              seo = result.get("seo", {})
              thumbnail = result.get("thumbnail")

              if not video_path:
                  raise RuntimeError("Video path was not returned.")

              manifest = {
                  "video": video_path,
                  "seo": seo,
                  "thumbnail": thumbnail
              }

              os.makedirs("output", exist_ok=True)

              with open(
                  "output/youtube_upload_manifest.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(manifest, f, indent=2, ensure_ascii=False)

              print("VIDEO CREATED SUCCESSFULLY")
              print(f"Video: {video_path}")
              print(f"Thumbnail: {thumbnail}")
              print("Upload manifest saved.")

          asyncio.run(main())
          PY

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sofia-luxury-video-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/*.jpg
            output/**/*.json
            output/**/*.png
            output/**/*.wav
          if-no-files-found: warn
          retention-days: 7

      - name: Upload completed video to YouTube
        if: success()
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json

          from platforms.youtube_uploader import YouTubeUploader

          with open(
              "output/youtube_upload_manifest.json",
              "r",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          video_path = manifest["video"]
          seo = manifest.get("seo", {})
          thumbnail = manifest.get("thumbnail")

          print("Authenticating with YouTube...")

          uploader = YouTubeUploader()

          if not uploader.authenticate():
              raise RuntimeError("YouTube authentication failed.")

          print("YouTube authentication successful.")

          upload = uploader.upload_video(
              video_path,
              seo,
              privacy="private"
          )

          if not upload.get("success"):
              raise RuntimeError(
                  f"YouTube upload failed: {upload}"
              )

          print("YouTube upload successful:")
          print(upload["url"])

          if thumbnail:
              print("Uploading thumbnail...")
              uploader.set_thumbnail(
                  upload["video_id"],
                  thumbnail
              )

          print("SOFIA VIDEO UPLOAD COMPLETE.")
          PY
